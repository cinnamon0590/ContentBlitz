# Continuous integration: lint + the offline test suite on every push and pull request.
# No API keys are needed — every agent runs against the scripted fakes in tests/conftest.py,
# and the live tests (`pytest -m live`) are excluded by the default `addopts`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Offline tests with coverage (fails under 90%)
        env:
          APP_ENV: development
          LLM_PROVIDER: openai
        run: python -m pytest --cov=src --cov-report=term --cov-fail-under=90
