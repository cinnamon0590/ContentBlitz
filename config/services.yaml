# Provider catalogue, fallback chains, and pricing (shared by all environments).
llm:
  provider: openai               # overridden by LLM_PROVIDER env var
  models:
    openai:
      smart: gpt-4o              # long-form writing, research synthesis
      fast: gpt-4o-mini          # routing, scoring, prompt enhancement
      fallbacks: [gpt-4.1-mini]  # tried if the primary model errors
    anthropic:
      smart: claude-sonnet-5-5
      fast: claude-haiku-5-5
      fallbacks: []
    gemini:
      smart: gemini-pro-latest    # alias; gemini-2.5-* are retired for new users
      fast: gemini-3.8-flash
      fallbacks: []
  temperature:
    smart: 0.7
    fast: 0.0
  request_timeout_s: 60
  max_retries: 2

research:
  chain: [serpapi, tavily, perplexity]   # tried in order; first success wins
  results_per_query: 5
  max_queries: 4
  perplexity_preset: fast             # Agent API preset: fast | low | medium | high | xhigh
  request_timeout_s: 25

images:
  chain: [gpt-image-1, gpt-image-1-mini, gemini-2.5-flash-image, placeholder]   # DALL-E 2/3 are retired
  quality: medium                     # the API defaults to "high" (~4x the cost)
  sizes:
    gpt-image-1: 1536x1024
    gpt-image-1-mini: 1536x1024
    gemini-2.5-flash-image: 1536x1024   # sent as the closest aspect ratio (3:2); returns 1248x832
  min_dimension_px: 256

# USD per 1M tokens (input, output) — used for cost tracking only. Update as prices change.
pricing:
  gpt-4o: [2.50, 10.00]
  gpt-4o-mini: [0.15, 0.60]
  gpt-4.1-mini: [0.40, 1.60]
  # Models missing from this table are tracked as 'unpriced' (tokens only).
image_pricing:          # USD per image (approx.)
  gpt-image-1: 0.063            # medium, 1536x1024
  gpt-image-1-mini: 0.015       # medium, 1536x1024
  gemini-2.5-flash-image: 0.039 # ~1290 output tokens at $30 / 1M
  placeholder: 0.0
search_pricing:         # USD per call (approx.; free tiers first)
  serpapi: 0.0
  tavily: 0.0
  perplexity: 0.002             # fast preset, measured
